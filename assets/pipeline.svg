<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs></defs><style>.s{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}</style><rect width="1000" height="190" rx="18" fill="#05070f" stroke="#1d2a4d"/><path d="M100 62 H900" stroke="#1d2a4d" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/></path><circle r="6" fill="#ff3df2" cy="62"><animate attributeName="cx" values="100;900" dur="6s" repeatCount="indefinite"/></circle><circle cx="100" cy="62" r="22" fill="#0a1020" stroke="#ff3df2" stroke-width="2.5"/><text x="100" y="68" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#ff3df2">1</text><text x="100" y="112" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#e8f0ff">Idea</text><text x="100" y="138" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">Start with the problem</text><text x="100" y="155" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">and the person using it</text><circle cx="300" cy="62" r="22" fill="#0a1020" stroke="#00e5ff" stroke-width="2.5"/><text x="300" y="68" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#00e5ff">2</text><text x="300" y="112" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#e8f0ff">Architecture</text><text x="300" y="138" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">Riverpod, Provider or GetX;</text><text x="300" y="155" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">Firebase or MongoDB</text><circle cx="500" cy="62" r="22" fill="#0a1020" stroke="#22ffb0" stroke-width="2.5"/><text x="500" y="68" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#22ffb0">3</text><text x="500" y="112" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#e8f0ff">Build</text><text x="500" y="138" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">Flutter for Android + iOS,</text><text x="500" y="155" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">native via platform channels</text><circle cx="700" cy="62" r="22" fill="#0a1020" stroke="#ffc15a" stroke-width="2.5"/><text x="700" y="68" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#ffc15a">4</text><text x="700" y="112" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#e8f0ff">Connect</text><text x="700" y="138" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">BLE · USB · GPS · SMS</text><text x="700" y="155" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">proprietary devices to apps</text><circle cx="900" cy="62" r="22" fill="#0a1020" stroke="#7c5cff" stroke-width="2.5"/><text x="900" y="68" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#7c5cff">5</text><text x="900" y="112" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#e8f0ff">Ship + iterate</text><text x="900" y="138" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">App Store, Google Play,</text><text x="900" y="155" text-anchor="middle" class="s" font-size="12" fill="#8fa3cc">then updates and fixes</text></svg>